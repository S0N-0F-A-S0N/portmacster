name: Kext macOS Build

on:
  push:
    branches: [feat/macos-initial-implementation]
    paths:
      - 'macos_kext/**'
  pull_request:
    branches: [feat/macos-initial-implementation]
    paths:
      - 'macos_kext/**'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Add any specific setup steps for your kext (like Xcode setup) here

      - name: Build macOS Kext
        run: |
          echo "Replace this with your actual kext build command"
          mkdir -p build
          # Example: xcodebuild -project macos_kext/YourKext.xcodeproj -scheme YourKext -configuration Release
          # cp path/to/built/YourKext.kext build/

      - name: Create .zip and .dmg
        run: |
          cd build
          zip kext-macos.zip *.kext || true
          hdiutil create -volname "KextBuild" -srcfolder . -ov -format UDZO kext-macos.dmg || true

      - name: Upload .zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: kext-macos-zip
          path: build/kext-macos.zip

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: kext-macos-dmg
          path: build/kext-macos.dmg
