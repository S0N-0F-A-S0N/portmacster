name: Tauri macOS Build

on:
  push:
    branches: [feat/macos-initial-implementation]
    paths:
      - 'desktop/tauri/**'
  pull_request:
    branches: [feat/macos-initial-implementation]
    paths:
      - 'desktop/tauri/**'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd desktop/tauri
          npm install

      - name: Build Tauri app (macOS)
        run: |
          cd desktop/tauri
          npm run tauri build

      - name: Find built .app
        id: findapp
        run: |
          APP_PATH=$(find desktop/tauri/src-tauri/target/release/bundle/dmg -name "*.dmg" -print -quit)
          ZIP_PATH=$(find desktop/tauri/src-tauri/target/release/bundle/zip -name "*.zip" -print -quit)
          echo "dmg_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "zip_path=$ZIP_PATH" >> $GITHUB_OUTPUT

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-dmg
          path: ${{ steps.findapp.outputs.dmg_path }}

      - name: Upload .zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-zip
          path: ${{ steps.findapp.outputs.zip_path }}
