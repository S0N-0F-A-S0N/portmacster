name: macOS System Extension & XPC Service

on:
  push:
    paths:
      - 'service/firewall/interception/macos/**'
      - 'macos-app-placeholder/**' # If changes here affect NE/XPC bundling
      - 'Earthfile' # If Earthfile changes affect these targets
    branches:
      - master
      - develop
  pull_request:
    paths:
      - 'service/firewall/interception/macos/**'
      - 'macos-app-placeholder/**'
      - 'Earthfile'
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        run: |
          brew install --cask docker
          open /Applications/Docker.app
          sleep 10
          docker --version

      - name: Log in to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Earthly
        uses: actions/cache@v3
        with:
          path: ~/.earthly
          key: earthly-cache-macOS-ARM64-${{ runner.os }}-${{ hashFiles('**/earthly.config') }}
          restore-keys: |
            earthly-cache-macOS-ARM64-${{ runner.os }}-
