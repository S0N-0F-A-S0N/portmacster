name: Go macOS Build

on:
  push:
    branches:
      - feat/macos-initial-implementation
    paths:
      - '**.go'
      - 'cmds/**'
      - 'runtime/**'
      - 'service/**'
      - 'spn/**'
  pull_request:
    branches:
      - feat/macos-initial-implementation
    paths:
      - '**.go'
      - 'cmds/**'
      - 'runtime/**'
      - 'service/**'
      - 'spn/**'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.21'

      - name: Build all binaries
        run: |
          mkdir -p build
          go build -o build/portmaster-core ./cmds/portmaster-core
          go build -o build/portmaster-start ./cmds/portmaster-start

      - name: Create .zip and .dmg
        run: |
          cd build
          zip portmacster-macos.zip portmacster
          hdiutil create -volname "Portmacster" -srcfolder . -ov -format UDZO portmacster-macos.dmg

      - name: Upload .zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmacster-macos-zip
          path: build/portmacster-macos.zip

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmacster-macos-dmg
          path: build/portmacster-macos.dmg
